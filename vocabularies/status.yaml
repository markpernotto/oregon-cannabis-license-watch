scheme: olcc.status
title: OLCC License Status
description: >
  Controlled vocabulary for license status. The source publishes no status
  column; `etl.transform._derive_status` maps the portal's `license_expired`
  Yes/No flag plus `inactive_date` onto these terms. Terms not observable in
  the source are retained for cross-referencing OLCC bulletins and for
  potential future source expansion.
source:
  name: Oregon Liquor and Cannabis Commission (Oregon Open Data Portal)
  url: https://data.oregon.gov/d/q32u-cmam
verified_at: 2026-08-24

# The retired Tableau view (2026-04 .. 2026-08) was pre-filtered to active
# licenses and published a literal Status column that was ACTIVE for every
# row. Only ACTIVE was observable then; de-activations had to be inferred
# from a license disappearing. See docs/SOURCE_HISTORY.md.

terms:
  - id: ACTIVE
    preferred_label: Active
    source_term: ACTIVE
    observable_in_source: true
    derived_from: license_expired == "No"
    definition: >
      License is in good standing; licensee is authorized to operate. Note
      that OLCC keeps a license active while a renewal is in process, so an
      ACTIVE license may sit past its printed expiration_date.

  - id: INACTIVE
    preferred_label: Inactive
    source_term: INACTIVE
    observable_in_source: true
    derived_from: license_expired == "Yes" AND inactive_date IS NOT NULL
    definition: >
      License ended on inactive_date. Most such dates fall before the term's
      expiration_date, meaning the license was surrendered or revoked rather
      than allowed to lapse. The source does not publish which, so we do not
      distinguish SURRENDERED from REVOKED.

  - id: EXPIRED
    preferred_label: Expired
    source_term: EXPIRED
    observable_in_source: true
    derived_from: license_expired == "Yes" AND inactive_date IS NULL
    definition: >
      License was not renewed and no explicit end date was recorded; it
      simply lapsed at the end of its term.

  - id: SURRENDERED
    preferred_label: Surrendered
    source_term: SURRENDERED
    observable_in_source: false
    definition: >
      Licensee voluntarily relinquished the license. Subsumed by INACTIVE —
      the source does not publish the reason.

  - id: REVOKED
    preferred_label: Revoked
    source_term: REVOKED
    observable_in_source: false
    definition: >
      OLCC terminated the license for cause. Subsumed by INACTIVE — the
      source does not publish the reason.

  - id: SUSPENDED
    preferred_label: Suspended
    source_term: SUSPENDED
    observable_in_source: false
    definition: License operations temporarily halted by OLCC action.

  - id: PENDING
    preferred_label: Pending
    source_term: PENDING
    observable_in_source: false
    definition: Application submitted; license not yet issued.
